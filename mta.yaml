_schema-version: "3.2"
ID: cx-attachments-migrationapp
version: 1.0.0
description: "SAP CAP app to migrate SAP C4C account attachments to a target endpoint"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ---- CAP service (Node.js) -----------------------------------------
  - name: cx-attachments-migrationapp-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    properties:
      # Interim: no database provisioned yet. App runs DB-less; anything that
      # needs to persist returns a clear error. Remove this (and restore the
      # db bindings below) once HANA is available.
      PERSISTENCE_DISABLED: "true"
    requires:
      - name: cx-attachments-migrationapp-auth
      - name: cx-attachments-migrationapp-destination

  # ---- HANA deployer (disabled until HANA is provisioned) ------------
  # - name: cx-attachments-migrationapp-db-deployer
  #   type: hdb
  #   path: gen/db
  #   parameters:
  #     buildpack: nodejs_buildpack
  #   requires:
  #     - name: cx-attachments-migrationapp-db

  # ---- Standalone approuter: single login URL for all three Fiori apps,
  #      and reverse-proxy to the CAP service at /migration/* -------------
  - name: cx-attachments-migrationapp-approuter
    type: nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
      requires:
        - name: migrationapp
          artifacts: [ "*" ]
          target-path: resources/migration-ui
        - name: jobsapp
          artifacts: [ "*" ]
          target-path: resources/jobs-ui
        - name: queriesapp
          artifacts: [ "*" ]
          target-path: resources/queries-ui
        - name: rfqapp
          artifacts: [ "*" ]
          target-path: resources/rfq-ui
    requires:
      - name: cx-attachments-migrationapp-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: migrationapp
    type: html5
    path: app/migration
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - rm -rf node_modules
      supported-platforms: []

  - name: jobsapp
    type: html5
    path: app/jobs
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - rm -rf node_modules
      supported-platforms: []

  - name: queriesapp
    type: html5
    path: app/queries
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - rm -rf node_modules
      supported-platforms: []

  - name: rfqapp
    type: html5
    path: app/rfq
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - rm -rf node_modules
      supported-platforms: []

resources:
  # HANA container disabled until HANA Cloud is provisioned. Restore this block
  # (and the db bindings/deployer above) and set db kind back to hana-cloud to
  # enable persistence.
  # - name: cx-attachments-migrationapp-db
  #   type: com.sap.xs.hdi-container
  #   parameters:
  #     service: hana
  #     service-plan: hdi-shared

  - name: cx-attachments-migrationapp-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cx-attachments-migrationapp-${space}

  - name: cx-attachments-migrationapp-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
